[template]
# Oldest version tested with the post-generation script.
cargo_generate_version = ">=0.26.0"
# Copied as-is, without placeholder substitution: these files use `{{ }}`
# for their own syntax.
exclude = [".github-project/workflows/**", "justfile", "just/**", "release-plz.toml"]
# The template repository's own files. The project's versions are stored
# as README.project.md, LICENSE.project and .github-project/, and
# post-generate.rhai moves them into place.
ignore = ["README.md", "LICENSE", ".github"]

[hooks]
post = ["post-generate.rhai"]

[placeholders.description]
type = "string"
prompt = "One-line description of the crate"
default = "A Rust library"

[placeholders.github_owner]
type = "string"
prompt = "GitHub user or organisation that will own the repository"
default = "sreea05"

[placeholders.contact_email]
type = "string"
prompt = "Email address for private code-of-conduct reports"
regex = "^[^@\\s]+@[^@\\s]+\\.[^@\\s]+$"

[placeholders.uses_unsafe]
type = "bool"
prompt = "Will this crate contain `unsafe` code? (enables Miri)"
default = false

[placeholders.fuzzing]
type = "bool"
prompt = "Add cargo-fuzz fuzzing targets?"
default = false

[placeholders.benchmarks]
type = "bool"
prompt = "Add criterion benchmarks?"
default = true

[conditional.'!uses_unsafe']
ignore = [".github-project/workflows/miri.yml", "just/miri.just"]

[conditional.'!fuzzing']
ignore = ["fuzz", ".github-project/workflows/fuzz.yml", "just/fuzz.just"]

[conditional.'!benchmarks']
ignore = ["benches", "just/bench.just"]
