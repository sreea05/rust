[package]
name = "{{project-name}}"
version = "0.1.0"
edition = "2024"
# MSRV: about the last six months of stable Rust (stable minus 4).
# Raising it is a `feat:` commit, not a breaking change (see CONTRIBUTING.md).
rust-version = "1.96"
description = "{{description}}"
license = "MIT"
repository = "https://github.com/{{github_owner}}/{{project-name}}"
readme = "README.md"
keywords = []
categories = []
include = [
  "/src/**",
  "/benches/**",
  "/examples/**",
  "/tests/**",
  "/Cargo.toml",
  "/README.md",
  "/CHANGELOG.md",
  "/LICENSE",
]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints.rust]
{% if uses_unsafe -%}
# Modules that need unsafe opt in with `#[allow(unsafe_code)]`,
# so unsafe code is always easy to find.
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
{% else -%}
unsafe_code = "forbid"
{% endif -%}
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
unused_qualifications = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(docsrs)"] }

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
print_stdout = "warn"
print_stderr = "warn"
{% if uses_unsafe -%}
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
missing_safety_doc = "deny"
{% endif %}
[dependencies]

[dev-dependencies]
{% if benchmarks -%}
criterion = "0.8.2"

[[bench]]
name = "checked_add"
harness = false
{% endif -%}
