# cargo-nextest: https://nexte.st/docs/configuration/

[profile.default]
slow-timeout = { period = "30s", terminate-after = 4 }

# CI profile (CI sets NEXTEST_PROFILE=ci): run all tests even after a
# failure and show output only for failures.
[profile.ci]
fail-fast = false
failure-output = "immediate-final"
success-output = "never"
