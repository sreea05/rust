# cargo-nextest: https://nexte.st/docs/configuration/

[profile.default]
slow-timeout = { period = "30s", terminate-after = 4 }

# Used in CI via `--profile ci`: run every test even after a failure,
# show output only for failures, and write a JUnit report.
[profile.ci]
fail-fast = false
failure-output = "immediate-final"
success-output = "never"

[profile.ci.junit]
path = "junit.xml"
