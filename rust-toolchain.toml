# Toolchain for development and CI, pinned so everyone gets the same lints
# and formatting. Renovate proposes upgrades. The oldest Rust version the
# crate supports (MSRV) is `rust-version` in Cargo.toml.

[toolchain]
channel = "1.100.0"
components = ["rustfmt", "clippy", "llvm-tools"]
profile = "minimal"
