# Weekly run that catches breakage caused by outside changes: new Rust
# releases, new dependency versions, new security advisories, base image updates.
name: Scheduled

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

permissions: {}

env:
  NEXTEST_PROFILE: ci

jobs:
  # Rebuild the image from scratch to pick up base image updates and
  # confirm the Dockerfile still builds.
  image:
    name: Devcontainer image
    permissions:
      contents: read
      packages: write
    uses: $/.github/workflows/devcontainer.yml
    with:
      rebuild: true

  check:
    name: ${{ matrix.name }}
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: read
    container:
      # Pinned by digest at runtime (see devcontainer.yml).
      image: ${{ needs.image.outputs.image }} # zizmor: ignore[unpinned-images]
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: beta toolchain
            command: just test-toolchain beta
          - name: nightly toolchain
            command: just test-toolchain nightly
          - name: latest dependencies
            command: just test-latest
          - name: dependency audit
            command: just deny
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run ${{ matrix.command }}
        env:
          COMMAND: ${{ matrix.command }}
        run: $COMMAND
