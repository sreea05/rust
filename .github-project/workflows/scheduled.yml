# Weekly run that catches breakage caused by outside changes: new Rust
# releases, new dependency versions, new security advisories, base image updates.
name: Scheduled

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

permissions: {}

env:
  NEXTEST_PROFILE: ci

jobs:
  # Rebuild the image from scratch to pick up base image updates and
  # confirm the Dockerfile still builds.
  image:
    name: Devcontainer image
    permissions:
      contents: read
      packages: write
    uses: $/.github/workflows/devcontainer.yml
    with:
      rebuild: true

  check:
    name: ${{ matrix.name }}
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: read
    container:
      # Pinned by digest at runtime (see devcontainer.yml).
      image: ${{ needs.image.outputs.image }} # zizmor: ignore[unpinned-images]
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: beta toolchain
            command: just test-toolchain beta
          - name: nightly toolchain
            command: just test-toolchain nightly
          - name: latest dependencies
            command: just test-latest
          - name: dependency audit
            command: just deny
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run ${{ matrix.command }}
        env:
          COMMAND: ${{ matrix.command }}
        run: $COMMAND

  # Each rebuild leaves the previous image untagged. Delete all but the
  # newest few untagged versions so registry storage doesn't grow forever.
  prune-images:
    name: Prune old devcontainer images
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      packages: write
    steps:
      - name: Delete old untagged image versions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          OWNER_TYPE: ${{ github.event.repository.owner.type }}
          REPO: ${{ github.event.repository.name }}
          KEEP: "5"
        run: |
          if [[ "$OWNER_TYPE" == "Organization" ]]; then scope="orgs/$OWNER"; else scope="users/$OWNER"; fi
          package=$(jq -rn --arg p "${REPO,,}/devcontainer" '$p | @uri')
          url="$scope/packages/container/$package/versions"
          # Versions are listed newest first; keep the newest $KEEP untagged.
          gh api --paginate "$url" --jq '.[] | select(.metadata.container.tags == []) | .id' |
            tail -n "+$((KEEP + 1))" |
            while read -r id; do
              echo "Deleting version $id"
              gh api --method DELETE "$url/$id"
            done
