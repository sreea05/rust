name: Feature request
description: Suggest a new capability or API change
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do that the crate makes hard today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What API or behaviour would solve it? Include example code if you can.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
