# Git hooks (https://lefthook.dev). Enable with `just setup`.
# Only fast checks run here; `just ci` runs the rest.

pre-commit:
  parallel: true
  jobs:
    - name: rustfmt
      glob: "*.rs"
      run: just fmt-check
    - name: taplo
      glob: "*.toml"
      run: just toml-check
    - name: typos
      run: typos {staged_files}
