# Tests the template: generates a minimal and a full project, builds each
# one's devcontainer image, and runs all its checks inside it.
name: Template

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  generate:
    name: ${{ matrix.variant }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: minimal
            defines: -d uses_unsafe=false -d fuzzing=false -d benchmarks=false -d codecov=false
            extras: "true"
          - variant: full
            defines: -d uses_unsafe=true -d fuzzing=true -d benchmarks=true -d codecov=true
            extras: just miri && just fuzz 10 && just bench --no-run
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install cargo-generate
        uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2.88.1
        with:
          tool: cargo-generate@0.26.0

      - name: Generate project
        env:
          DEFINES: ${{ matrix.defines }}
        run: |
          # shellcheck disable=SC2086 # DEFINES holds several arguments
          cargo generate --path . --name demo-lib --destination "$RUNNER_TEMP" --silent \
            -d description="Template test" -d github_owner=example $DEFINES

      - name: Build devcontainer image
        working-directory: ${{ runner.temp }}/demo-lib
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          docker build --secret id=github_token,env=GITHUB_TOKEN \
            -f .devcontainer/Dockerfile -t demo-lib-dev .

      - name: Run all checks in the devcontainer
        working-directory: ${{ runner.temp }}/demo-lib
        env:
          EXTRAS: ${{ matrix.extras }}
        run: |
          docker run --rm -v "$PWD:/work" -w /work -e EXTRAS demo-lib-dev bash -euo pipefail -c '
            git config --global --add safe.directory "*"
            just setup
            just ci
            eval "$EXTRAS"
          '
