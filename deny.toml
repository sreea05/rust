# cargo-deny: https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = true

[advisories]
# Fail on vulnerable, unmaintained, unsound or yanked crates.
# To accept an advisory, add its ID to `ignore` with a reason.
yanked = "deny"
ignore = []

[licenses]
# Permissive licenses compatible with an MIT library.

allow = [
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
